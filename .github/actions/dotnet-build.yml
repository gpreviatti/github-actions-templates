inputs:
  dotnet_version:
    required: true
    type: string
    default: '8.x'
  build_mode:
    required: true
    type: string
    default: 'Release'

runs:
  using: "composite"
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet_version }}

    - name: Build
      run: dotnet build -c ${{ inputs.build_mode }}