on:
  workflow_call:
    inputs:
      test_project_path:
        required: true
        type: string
      dotnet_version:
        required: true
        type: string
        default: '8.x'
      no_build:
        type: boolean
        default: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Test
        run: |
          if ("${{ inputs.no_build }}" = "true") {
            dotnet test ${{ inputs.test_project_path }} --no-build
          }
          else {
            dotnet test ${{ inputs.test_project_path }}
          }