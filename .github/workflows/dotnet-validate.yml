on:
  workflow_call:
    inputs:
      stryker_enable:
        required: false
        type: boolean
        default: true
      unit_test_project_path:
        required: true
        type: string
      domain_stryker_config_path:
        required: true
        type: string
      application_stryker_config_path:
        required: true
        type: string
      stryker_log_level:
        required: false
        type: string
        default: 'info'
      integration_test_project_path:
        required: true
        type: string
      docker_compose_file_path:
        required: true
        type: string
      dotnet_version:
        required: true
        type: string
        default: '8.x'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet_version }}

    - name: Unit Tests
      run: dotnet test ${{ inputs.unit_test_project_path }}

    - name: Install Stryker
      if: ${{ inputs.stryker_enable }}
      run: dotnet tool install -g dotnet-stryker

    - name: Run Stryker Domain
      if: ${{ inputs.stryker_enable }}
      run: dotnet stryker -tp ${{inputs.unit_test_project_path}} -f ${{inputs.domain_stryker_config_path}} -V ${{inputs.stryker_log_level}}
    
    - name: Run Stryker Application
      if: ${{ inputs.stryker_enable }}
      run: dotnet stryker -tp ${{inputs.unit_test_project_path}} -f ${{inputs.application_stryker_config_path}} -V ${{inputs.stryker_log_level}}

    - name: Start Docker Compose
      run: docker compose -f ${{ inputs.docker_compose_file_path }} up -d && sleep 10

    - name: Integration Tests
      run: dotnet test ${{ inputs.integration_test_project_path}}
