on:
  workflow_call:
    inputs:
      docker_compose_file_path:
        required: true
        type: string
      test_project_path:
        required: true
        type: string
      dotnet_version:
        required: true
        type: string
        default: '10.x'
      build_configuration:
        type: string
        default: 'Release'
      verbosity:
        type: string
        default: 'n'
      no_build:
        type: boolean
        default: true

jobs:
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet_version }}

    - name: Start Docker Compose
      run: docker compose -f ${{ inputs.docker_compose_file_path }} up -d && sleep 10

    - name: Test With Build
      if: ${{ !inputs.no_build }}
      run: |
        dotnet test ${{ inputs.test_project_path }} -v ${{ inputs.verbosity }} --no-build -c ${{ inputs.build_configuration }}

    - name: Test Without Build
      if: ${{ inputs.no_build }}
      run: |
        dotnet test ${{ inputs.test_project_path }} -v ${{ inputs.verbosity }} -c ${{ inputs.build_configuration }}