on:
  workflow_call:
    inputs:
      docker_compose_file_path:
        required: true
        type: string
      test_project_path:
        required: true
        type: string
      dotnet_version:
        required: true
        type: string
        default: '8.x'
      no_build:
        type: boolean
        default: false

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet_version }}

    - name: Start Docker Compose
      run: docker compose -f ${{ inputs.docker_compose_file_path }} up -d && sleep 10

    - name: Test
      shell: powershell
      run: |
        if ("${{ inputs.no_build }}" -eq "true") {
          dotnet test ${{ inputs.test_project_path }} --no-build
        } else {
          dotnet test ${{ inputs.test_project_path }}
        }