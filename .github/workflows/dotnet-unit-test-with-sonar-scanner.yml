on:
  workflow_call:
    inputs:
      organization:
        type: string
        default: ${{ github.repository_owner }}
      project:
        type: string
        default: ${{ github.repository }}
      dotnet_version:
        type: string
        default: '8.x'
      unit_test_verbosity:
        type: string
        default: 'n'
      unit_test_project_path:
        required: true
        type: string
      sonar_inclusions:
        type: string
        default: '**src/Application**,**src/Domain**'
      sonar_host_url:
        type: string
        default: 'https://sonarcloud.io'
      no_build:
        type: boolean
        default: false
      build_configuration:
        type: string
        default: 'Release'
    secrets:
      sonar_token:
        required: true

jobs:
  unit-tests-with-sonar-scanner:
    name: Unit Tests with SonarQube Cloud Scanner
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Begin SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.sonar_token }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"${{ inputs.project }}" /o:"${{ inputs.organization }}" /d:sonar.host.url="${{ inputs.sonar_host_url }}" /d:sonar.token="${{ secrets.sonar_token }}" /d:sonar.dotnet.excludeTestProjects=true /d:sonar.cs.opencover.reportsPaths="**coverage.opencover.xml" /d:sonar.inclusions="${{ inputs.sonar_inclusions }}"

      - name: Run unit tests with coverage with build
        if: ${{ !inputs.no_build }}
        shell: powershell
        run: |
          dotnet test ${{ inputs.unit_test_project_path }} -v ${{ inputs.unit_test_verbosity }} --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover -c ${{ inputs.build_configuration }}

      - name: Run unit tests with coverage without build
        if: ${{ inputs.no_build }}
        shell: powershell
        run: |
          dotnet test ${{ inputs.unit_test_project_path }} -v ${{ inputs.unit_test_verbosity }} --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover --no-build -c ${{ inputs.build_configuration }}

      - name: End SonarQube Cloud analysis
        if: ${{ always() }}
        env:
          SONAR_TOKEN: ${{ secrets.sonar_token }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.sonar_token }}"

