on:
  workflow_call:
    inputs:
      dotnet_version:
        required: true
        type: string
        default: '8.x'
      build_mode:
        required: false
        type: string
        default: 'Release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: ./.github/actions/dotnet-build.yml
      with:
        dotnet-version: ${{ inputs.dotnet_version }}
        build-mode: ${{ inputs.build_mode }}
