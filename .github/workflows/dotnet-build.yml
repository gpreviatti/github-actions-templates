on:
  workflow_call:
    inputs:
      dotnet_version:
        required: true
        type: string
        default: '8.x'
      build_mode:
        required: false
        type: string
        default: 'Release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet_version }}

    - name: Build
      run: dotnet build -c ${{ inputs.build_mode }}
