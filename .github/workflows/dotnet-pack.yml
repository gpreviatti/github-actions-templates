on:
  workflow_call:
    inputs:
      package_version:
        required: true
        type: string
      dotnet_version:
        required: true
        type: string
        default: '8.x'
    secrets:
      nuget_api_key:
        required: true

jobs:
  dotnet-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dotnet-build.yml
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          build-mode: 'Release'
        
      - name: Pack
        run: dotnet pack -p:PackageVersion=${{ inputs.package_version}}
        
      - name: Push to NuGet
        run: dotnet nuget push "./bin/Release/*.nupkg" --api-key ${{secrets.nuget_api_key}} --source https://api.nuget.org/v3/index.json