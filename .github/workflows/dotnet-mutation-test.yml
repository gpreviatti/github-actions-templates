on:
  workflow_call:  
    inputs:
      test_project_path:
        required: true
        type: string
      stryker_config_path: 
        required: true
        type: string
      dotnet_version:
        required: true
        type: string
        default: '10.x'
      log_level:
        type: string
        default: 'info'
      name:
        type: string
        default: 'Mutation Tests'
      publish_dashboard_report:
        type: boolean
        default: false
      dashboard_project:
        type: string
        default: ''
      report_name:
        type: string
        default: 'mutation-report.json'
      dashboard_version:
        type: string
        default: ''
      dashboard_module:
        type: string
        default: ''
      dashboard_base_url:
        type: string
        default: 'https://dashboard.stryker-mutator.io'
    secrets:
      dashboard_api_key:
        required: false

jobs:
  mutation-tests:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Install Stryker
        run: dotnet tool install -g dotnet-stryker

      - name: Run Stryker
        if: ${{ !inputs.publish_dashboard_report }}
        run: dotnet stryker -tp ${{inputs.test_project_path}} -f ${{inputs.stryker_config_path}} -V ${{inputs.log_level}}

      - name: Run Stryker and generate JSON report
        if: ${{ inputs.publish_dashboard_report }}
        run: dotnet stryker -tp ${{inputs.test_project_path}} -f ${{inputs.stryker_config_path}} -V ${{inputs.log_level}} --reporter json

      - name: Send report to Stryker dashboard (curl)
        if: ${{ inputs.publish_dashboard_report }}
        run: |
          REPORT_FILE=$(find StrykerOutput -type f -name "${{ inputs.report_name }}" | sort | tail -n 1)

          if [ -z "$REPORT_FILE" ]; then
            echo "${{ inputs.report_name }} not found under StrykerOutput."
            exit 1
          fi

          echo "Uploading mutation report to Stryker dashboard for project '${{ inputs.dashboard_project || format('github.com/{0}/{1}', github.repository_owner, github.repository) }}' version '${{ inputs.dashboard_version || github.run_number }}'."
          curl --fail --show-error --silent \
            -X PUT "$DASHBOARD_BASE_URL/api/reports/${{ inputs.dashboard_project || format('github.com/{0}/{1}', github.repository_owner, github.repository) }}/${{ inputs.dashboard_version || github.run_number }}?module=${{ inputs.dashboard_module }}" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ secrets.dashboard_api_key }}" \
            -d "@$REPORT_FILE"
