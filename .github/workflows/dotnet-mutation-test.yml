on:
  workflow_call:  
    inputs:
      test_project_path:
        required: true
        type: string
      stryker_config_path: 
        required: true
        type: string
      dotnet_version:
        required: true
        type: string
        default: '8.x'
      log_level:
        type: string
        default: 'info'
      name:
        type: string
        default: 'Mutation Tests'
      publish_dashboard_report:
        type: boolean
        default: false
      dashboard_project:
        type: string
        default: ''
      dashboard_version:
        type: string
        default: ''
      dashboard_module:
        type: string
        default: ''
      dashboard_base_url:
        type: string
        default: 'https://dashboard.stryker-mutator.io'
    secrets:
      dashboard_api_key:
        required: false

jobs:
  mutation-tests:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Install Stryker
        run: dotnet tool install -g dotnet-stryker

      - name: Run Stryker
        if: ${{ !inputs.publish_dashboard_report }}
        run: dotnet stryker -tp ${{inputs.test_project_path}} -f ${{inputs.stryker_config_path}} -V ${{inputs.log_level}}

      - name: Run Stryker and generate JSON report
        if: ${{ inputs.publish_dashboard_report }}
        run: dotnet stryker -tp ${{inputs.test_project_path}} -f ${{inputs.stryker_config_path}} -V ${{inputs.log_level}} --reporter json

      - name: Send report to Stryker dashboard (curl)
        if: ${{ inputs.publish_dashboard_report }}
        run: |
          REPORT_FILE=$(find StrykerOutput -type f -name "mutation-report.json" | sort | tail -n 1)

          if [ -z "$REPORT_FILE" ]; then
            echo "mutation-report.json not found under StrykerOutput."
            exit 1
          fi

          echo "Uploading mutation report to Stryker dashboard for project '$DASHBOARD_PROJECT' version '$DASHBOARD_VERSION'."
          curl --fail --show-error --silent \
            -X PUT "$DASHBOARD_BASE_URL/api/reports/$DASHBOARD_PROJECT/$DASHBOARD_VERSION?module=$DASHBOARD_MODULE" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $DASHBOARD_API_KEY" \
            -d "@$REPORT_FILE"
